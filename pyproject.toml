[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "site-intelligence-mcp"
version = "0.1.4"
description = "MCP server for ecological and agricultural land suitability scoring from satellite data — site selection for agtech, conservation, environmental consulting and apiculture."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alper Bayrakdar" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "geospatial",
    "satellite",
    "land-suitability",
    "site-selection",
    "agriculture",
    "agtech",
    "conservation",
    "remote-sensing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/bayrakdaralper/site-intelligence-mcp"
Repository = "https://github.com/bayrakdaralper/site-intelligence-mcp"
Issues = "https://github.com/bayrakdaralper/site-intelligence-mcp/issues"
"API listing" = "https://rapidapi.com/bayrakdaralper/api/site-intelligence-api"

[project.scripts]
site-intelligence-mcp = "beelocate_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["beelocate_mcp"]
